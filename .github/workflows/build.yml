name: Build DynaTech Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_VERSION: "1.1.04"
  OUTPUT_NAME: "SF_DynaTech1.1.04.jar"

jobs:
  build:
    name: Universal Java 21 / Paper 1.21.11-26.3 / Slimefun Legacy
    runs-on: ubuntu-latest
    steps:
      - name: Check out DynaTech
        uses: actions/checkout@v6

      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon

      - name: Verify universal build metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq '<version>1.1.04</version>' pom.xml
          grep -Fq '<finalName>SF_DynaTech${project.version}</finalName>' pom.xml
          grep -Fq "api-version: '1.21'" src/main/resources/plugin.yml

      - name: Verify Doctor migration safety contract
        run: python3 scripts/verify_doctor_migration_provider.py .

      - name: Verify Paper 1.21.11 baseline compilation
        run: >-
          mvn -B clean verify --file pom.xml
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT

      - name: Verify Paper 26.2 compilation
        run: >-
          mvn -B clean verify --file pom.xml
          -Dpaper.version=26.2.build.112-stable
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT

      - name: Verify Paper 26.3 alpha compilation
        run: >-
          mvn -B clean verify --file pom.xml
          -Dpaper.version=26.3-rc-3.build.1-alpha
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT

      - name: Build universal release JAR from 1.21.11 baseline
        run: >-
          mvn -B clean package --file pom.xml
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT

      - name: Prepare pinned native wireless regression inputs
        run: python3 scripts/runtime/prepare_wireless_probe_inputs.py --out .native-inputs

      - name: Verify native wireless transfers and restart persistence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          inputs = json.loads(Path('.native-inputs/inputs.json').read_text())
          if inputs.get('result') != 'PASS' or set(inputs['paper']) != {'1.21.11', '26.2', '26.3'}:
              raise SystemExit('All three verified native runtime inputs are required')
          for version in ('1.21.11', '26.2', '26.3'):
              subprocess.run([
                  'python3', 'scripts/runtime/run_wireless_transfer_probe.py',
                  '--paper', inputs['paper'][version]['path'],
                  '--core', inputs['core']['path'],
                  '--addon', str(Path('target') / os.environ['OUTPUT_NAME']),
                  '--work-dir', str(Path('.native-wireless') / version),
                  '--java', str(Path(os.environ['JAVA_HOME']) / 'bin/java'),
                  '--expect', 'fixed',
              ], check=True)
          PY

      - name: Upload native wireless regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-wireless-transfer-reports
          path: |
            .native-inputs/inputs.json
            .native-wireless/*/evidence/*
          include-hidden-files: true
          if-no-files-found: warn

      - name: Stage and verify versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/${OUTPUT_NAME}"
          test -s "$JAR"
          cp "$JAR" "dist/${OUTPUT_NAME}"
          jar tf "dist/${OUTPUT_NAME}" | grep -Fxq 'plugin.yml'
          unzip -p "dist/${OUTPUT_NAME}" plugin.yml | grep -Fq "version: ${LEGACY_VERSION}"
          python3 - <<'PY'
          import pathlib, struct, zipfile
          jar = pathlib.Path('dist') / 'SF_DynaTech1.1.04.jar'
          max_major = 0
          with zipfile.ZipFile(jar) as zf:
              for name in zf.namelist():
                  if not name.endswith('.class'):
                      continue
                  data = zf.read(name)[:8]
                  if data[:4] != b'\xca\xfe\xba\xbe':
                      continue
                  max_major = max(max_major, struct.unpack('>H', data[6:8])[0])
          print(f'{jar}: maximum class major version {max_major}')
          if max_major > 65:
              raise SystemExit('JAR contains classes newer than Java 21 bytecode')
          PY
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="DynaTech 1.1.04 revalidates current Wireless Item Input/Output menus and linked locations before server-thread transfers. Transfers retain unaccepted source items, mark both changed menus for saving, and charge energy only when items move. Existing item IDs, metadata, linked-location format, slot order, whole-stack admission and normal eight-energy endpoint costs are preserved. The same release JAR is checked on three pinned Paper runtimes with transfer and restart tests. Minecraft 1.21.11 and Java 21 remain the runtime floor."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_DynaTech $TAG" --notes "$NOTES"
          fi
